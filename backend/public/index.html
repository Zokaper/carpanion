<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0716">
<title>Horizon Party</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div class="wash" aria-hidden="true"><img id="washImg" alt=""></div>

<!-- Join: the code (from the link) and a name, asked once on this phone. -->
<section id="join" class="screen" hidden>
  <div class="join">
    <h1>Join the party</h1>
    <p class="dim">Add songs to the car's queue from your phone.</p>
    <form id="joinForm" autocomplete="off">
      <label for="codeInput">Party code</label>
      <input id="codeInput" class="code" maxlength="6" autocapitalize="characters" spellcheck="false" placeholder="6 letters">
      <label for="nameInput">Your name</label>
      <input id="nameInput" maxlength="24" placeholder="Shown next to your songs">
      <p id="joinError" class="error" hidden></p>
      <button class="primary big" type="submit">Join</button>
    </form>
  </div>
</section>

<!-- The party ended, or the driver started a new code. -->
<section id="closed" class="screen" hidden>
  <div class="join">
    <p class="eyebrow" id="closedCode"></p>
    <h1 id="closedTitle"></h1>
    <p class="dim" id="closedText"></p>
    <button class="primary big" id="closedJoin" type="button">Join with a new code</button>
  </div>
</section>

<!-- The party: Now, Search and Queue tabs. -->
<section id="party" class="screen" hidden>
  <header class="top">
    <span class="code-tag"><span id="dot" class="dot"></span><span id="partyCode"></span></span>
    <button id="who" class="who" type="button" aria-label="Change your name"></button>
  </header>
  <div id="banner" class="banner" hidden></div>

  <main>
    <div id="tabNow" class="tab">
      <div class="now">
        <img id="nowCover" class="cover" alt="">
        <div class="now-text">
          <h2 id="nowTitle">Nothing playing yet</h2>
          <p id="nowArtist" class="dim"></p>
          <p id="nowBy" class="by"></p>
        </div>
        <div class="progress"><div class="bar"><div id="nowBar"></div></div>
          <div class="times"><span id="nowPos">0:00</span><span id="nowDur"></span></div></div>
        <div id="controls" class="controls" hidden>
          <button class="icon" data-media="previous" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12L18 18V6z"/></svg></button>
          <button class="icon play" data-media="playPause" aria-label="Play or pause"><svg id="playIcon" viewBox="0 0 24 24"></svg></button>
          <button class="icon" data-media="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        </div>
        <div id="mine" class="mine-list"></div>
        <div id="comingUp" class="coming" hidden></div>
        <button id="nowAdd" class="primary" type="button">Add a song</button>
      </div>
    </div>

    <div id="tabSearch" class="tab" hidden>
      <div id="searchHome">
        <h2 class="title">Search</h2>
        <div class="field">
          <svg viewBox="0 0 24 24" class="glass" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <label for="q" class="sr">Search songs, artists, albums</label>
          <input id="q" type="search" placeholder="Songs, artists, albums" autocomplete="off" enterkeyhint="search">
          <span id="spin" class="spin" hidden aria-label="Searching"></span>
          <button id="qClear" class="clear" type="button" aria-label="Clear" hidden><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="chips" role="tablist">
          <button class="chip on" data-filter="all" role="tab">All</button>
          <button class="chip" data-filter="songs" role="tab">Songs</button>
          <button class="chip" data-filter="artists" role="tab">Artists</button>
          <button class="chip" data-filter="albums" role="tab">Albums</button>
        </div>
        <div id="results"></div>
      </div>
      <div id="browse" hidden>
        <button id="browseBack" class="back" type="button"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span id="browseBackText">Back</span></button>
        <div id="browseBody"></div>
      </div>
    </div>

    <div id="tabLibrary" class="tab" hidden>
      <div id="libHome">
        <div class="queue-head"><h2 class="title">Library</h2><span id="libWho" class="dim"></span></div>
        <div id="libBody"></div>
      </div>
      <div id="libPage" hidden>
        <button id="libBack" class="back" type="button"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>Library</span></button>
        <div id="libPageBody"></div>
      </div>
    </div>

    <div id="tabMine" class="tab" hidden>
      <div class="queue-head"><h2 class="title">My queue</h2><span id="mineCount" class="dim"></span></div>
      <div id="mineTurn"></div>
      <div class="switch-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8c-2.2 0-4 1.8-4 4s1.8 4 4 4c3.5 0 6.5-8 10-8 2.2 0 4 1.8 4 4s-1.8 4-4 4c-3.5 0-6.5-8-10-8z"/></svg>
        <label for="endless" class="grow"><b>Endless</b><span class="dim">When your queue runs out, keep your turns with songs like yours</span></label>
        <button id="endless" class="switch" type="button" role="switch" aria-checked="false" aria-label="Endless"><span></span></button>
      </div>
      <div class="mine-tools"><span class="section" style="margin:0">PLAYS IN THIS ORDER</span>
        <span><button id="mineShuffle" class="showplayed" type="button">Shuffle</button> <button id="mineClear" class="showplayed" type="button">Clear</button></span></div>
      <div id="mineList"></div>
    </div>

    <div id="tabQueue" class="tab" hidden>
      <div class="queue-head"><h2 class="title">Queue</h2><span id="queueCount" class="dim"></span></div>
      <div id="queue"></div>
    </div>
  </main>

  <button id="mini" class="mini" type="button" hidden>
    <img id="miniCover" alt="">
    <span class="mini-text"><span id="miniTitle"></span><span id="miniSub" class="dim"></span></span>
    <span id="miniBar" class="mini-bar"></span>
  </button>
  <div id="toast" class="toast" role="status" hidden></div>

  <nav class="tabs">
    <button data-tab="Now" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/></svg>Now</button>
    <button data-tab="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search</button>
    <button data-tab="Library"><svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 4l4 16"/></svg>Library</button>
    <button data-tab="Queue" id="tabLast"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span id="tabLastText">Queue</span></button>
  </nav>
</section>

<div id="waking" class="waking" hidden><span class="spin"></span><span>Waking the server. The first visit of the day can take up to a minute.</span></div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
